# The main pipeline for dbake

resources:
  pipelines:
    dbake_etl:
      name: dbake_etl
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      root_path: "../src/dbake_etl"

      libraries:
        - glob:
            include: ../src/dbake_etl/transformations/**

      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}
