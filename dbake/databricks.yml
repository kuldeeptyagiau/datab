# This is a Declarative Automation Bundle definition for dbake.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: dbake
  uuid: 8396f750-d62a-41f6-94a8-a8af52b4120c

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-3f28de4b-63e6.cloud.databricks.com
    variables:
      catalog: d_bake
      schema: dev
  prod:
    mode: production
    workspace:
      host: https://dbc-3f28de4b-63e6.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/kuldeep.tyagi.au@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/kuldeep.tyagi.au@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: d_bake
      schema: prod
    permissions:
      - user_name: kuldeep.tyagi.au@gmail.com
        level: CAN_MANAGE
